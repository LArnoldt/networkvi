[project]
name = "networkvi"
version = "0.2.0"
description = "Biologically Guided Variational Inference for Interpretable Multimodal Single-Cell Integration and Mechanistic Discovery"
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "BSD-3-CLAUSE"
authors = [
    {name = "Lucas Arnoldt, Julius Upmeier zu Belzen, Luis Herrmann, Khue Nguyen, Naveed Ishaque, Fabian Theis, Bejamin Wild, Roland Eils"},
]
maintainers = [
    {name = "Lucas Arnoldt", email = "lucas.arnoldt@helmholtz-munich.de"},
]
urls.Documentation = "https://networkvi.readthedocs.io"
urls.Source = "https://github.com/LArnoldt/networkvi"
urls.Home-page = "https://networkvi.readthedocs.io"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "docrep>=0.3.2,<0.4",
    "flax>=0.8.5,<0.13",
    "lightning>=2.0,<3.0",
    "ml-collections>=0.1.1,<1.2.0",
    "mudata>=0.1.2,<0.4",
    "numpyro>=0.15.0,<0.20",
    "pyro-ppl>=1.9.0,<1.10.0",
    "rich>=12.0.0,<15.0.0",
    "scikit-learn>=0.21.2,<2.0",
    "sparse>=0.14.0,<0.18.0",
    "tensorboard>=2.0,<2.30",
    "torchmetrics>=0.11.0,<1.9",
    "xarray>=2023.2.0,<=2025.12.0",
    "pqdm>=0.2,<0.3",
    "prettytable>=3.0,<4.0",
    "goatools>=1.4.12,<1.6",
    "muon>=0.1.6,<0.2",
    "tabulate>=0.9.0,<0.10",
    "addict>=2.4.0,<2.5",
    "torch==2.8.0"
]

[project.optional-dependencies]
docs = [
    "docutils>=0.8,!=0.18.*,!=0.19.*", # see https://github.com/scverse/cookiecutter-scverse/pull/205
    "sphinx>=4.1",
    "ipython",
    "sphinx-book-theme>=1.0.1",
    "sphinx_copybutton",
    "sphinx-design",
    "sphinxext-opengraph",
    "sphinx-hoverxref",
    "sphinxcontrib-bibtex>=1.0.0",
    "myst-parser",
    "myst-nb",
    "sphinx-autodoc-typehints",
    "nbsphinx",
]
docsbuild = ["networkvi[docs]"]

tutorials = [
    "gdown",
    "jupyter",
]

all = ["networkvi[docs,tutorials]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ['src/networkvi']

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "F",  # Errors detected by Pyflakes
    "E",  # Error detected by Pycodestyle
    "W",  # Warning detected by Pycodestyle
    "I",  # isort
    "D",  # pydocstyle
    "B",  # flake8-bugbear
    "TID",  # flake8-tidy-imports
    "C4",  # flake8-comprehensions
    "BLE",  # flake8-blind-except
    "UP",  # pyupgrade
    "RUF100",  # Report unused noqa directives
]
ignore = [
    # allow I, O, l as variable names -> I is the identity matrix
    "E741",
    # Missing docstring in public package
    "D104",
    # Missing docstring in public module
    "D100",
    # Missing docstring in __init__
    "D107",
    # Errors from function calls in argument defaults. These are fine when the result is immutable.
    "B008",
    # __magic__ methods are are often self-explanatory, allow missing docstrings
    "D105",
    # first line should end with a period [Bug: doesn't work with single-line docstrings]
    "D400",
    # First line should be in imperative mood; try rephrasing
    "D401",
    ## Disable one in each pair of mutually incompatible rules
    # We don’t want a blank line before a class docstring
    "D203",
    # We want docstrings to start immediately after the opening triple quote
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["I", "BLE001"]
"tests/*" = ["D"]
"*/__init__.py" = ["F401"]
"src/networkvi/__init__.py" = ["I"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.jupytext]
formats = "ipynb,md"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
networkvi = { path = ".", editable = true }

[tool.pixi.tasks]
